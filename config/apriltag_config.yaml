# Tag ID -> sign type. IDs reference GodotSimulation/ducky-bot/textures/tag36h11/tag36_11_000XX.png
sign_tags:
  stop: [0]
  yield: [1]
  no_entry: [2]
  one_way_left: [3]
  one_way_right: [4]
  pedestrian: [5]
  duck_crossing: [6]

# Stop sign: hold for this many seconds once close enough, then resume.
# Trigger areas tuned to the small (65mm) sim tags: observed pixel areas peak
# in the low thousands at ~0.3m head-on, so thresholds sit well below that.
stop_duration_s: 4.0
stop_trigger_area: 1500

# Stop line: once the stop sign triggers, creep forward (instead of stopping
# immediately) until a red stop-line marking on the road reaches near the
# bottom of the frame, then stop for stop_duration_s. If no red line is seen
# within stop_line_search_timeout_s, fall back to stopping immediately (same
# stop_duration_s either way).
stop_line_hsv_lower1: [0, 120, 80]
stop_line_hsv_upper1: [10, 255, 255]
stop_line_hsv_lower2: [170, 120, 80]
stop_line_hsv_upper2: [180, 255, 255]
stop_line_row_threshold: 0.85
stop_line_min_pixels: 30
stop_line_search_timeout_s: 2.5
stop_line_creep_speed: 0.08

# Yield sign: brief slowdown.
yield_slowdown_factor: 0.5
yield_duration_s: 1.5
yield_trigger_area: 1000

# Pedestrian / duck-crossing: slowdown, full stop only if a duckie is on the road.
duck_crossing_slowdown_factor: 0.4
duck_crossing_trigger_area: 2000
duck_stop_area: 4000

# Per-tag re-trigger cooldown once the robot has reacted to a sign.
sign_cooldown_s: 6.0

# Intersection turn-choice signs: one_way_left/one_way_right mark a turn as
# mandatory. If the signs visible at an intersection name only ONE direction
# (a lone one_way_left/one_way_right, or no_entry + exactly one of them), the
# robot takes that single available way directly. If MULTIPLE directions are
# possible (a bare no_entry with no one_way sign, or both one_way_left and
# one_way_right together), the robot picks randomly among them.
# omega = (2 * turn_bias) * max_speed / baseline (Moveee.gd: max_speed=1.0, baseline=0.10)
# -> turn_bias=0.08 gives omega ~= 1.6 rad/s; over turn_duration_s=1.0s that's
#    ~92 deg, i.e. roughly a 90-degree turn instead of a multi-rotation spin.
turn_trigger_area: 1200
turn_duration_s: 1.0
turn_speed: 0.2
turn_bias: 0.08
